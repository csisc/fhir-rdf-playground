name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check the playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the conversion, SPARQL, ShEx and round-trip checks
        run: node scripts/check.mjs

  build:
    name: Build the site
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          # Anything else you add to the repo root that the page needs:
          [ -d assets ] && cp -r assets _site/assets || true

      - name: Stamp the build
        run: |
          printf '{"commit":"%s","built":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/build.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
